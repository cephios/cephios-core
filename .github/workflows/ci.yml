name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: sync (install package + dev deps)
        run: uv sync

      - name: lint (ruff)
        run: uv run ruff check .

      - name: type (mypy)
        run: uv run mypy

      - name: test (pytest)
        run: uv run pytest

  build:
    name: build (sdist + wheel)
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: build
        run: uv build

      - name: list artifacts
        run: ls -l dist
