[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cephios-core"
dynamic = ["version"]
description = "The Python reference implementation of The Cephios Protocol v1.0"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Cephios" }]
keywords = ["cephios", "neural-data", "encryption", "protocol", "conformance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "cryptography>=42",
    "httpx>=0.27",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
# Conformance-runner extra — an empty placeholder here; populated in Group 12 Commit 6
# (the `cephios-core[conformance]` runner). Declared now so the extra name is stable.
conformance = []

[project.urls]
Homepage = "https://github.com/cephios/cephios-core"
Repository = "https://github.com/cephios/cephios-core"
"Conformance suite" = "https://github.com/cephios/protocol-tests"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
]

[tool.hatch.version]
path = "src/cephios_core/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cephios_core"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["cephios_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
